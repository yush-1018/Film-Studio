version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database & State Services
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: film-studio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: film-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: film-studio-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  backend-agents:
    build:
      context: ./backend-agents
      dockerfile: Dockerfile
    container_name: film-studio-backend-agents
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
      DEFAULT_LLM_PROVIDER: mock
      DEFAULT_STT_PROVIDER: mock
      DEFAULT_TTS_PROVIDER: mock
      DEFAULT_IMAGE_PROVIDER: mock
      DEFAULT_VIDEO_PROVIDER: mock
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: film-studio-assets
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: film-studio-backend-node
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/film_studio
      AGENTS_SERVICE_URL: http://backend-agents:8000
      CORS_ORIGIN: "*"
    depends_on:
      mongodb:
        condition: service_healthy
      backend-agents:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: film-studio-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend-node:4000
    depends_on:
      - backend-node

volumes:
  mongo_data:
  redis_data:
  minio_data:
